version: 2.1
jobs:
  build:
    docker:
      - image: cimg/node:18.16.0
    steps:
      - checkout
      - run:
          name: Check Node Version
          command: node --version
      - restore_cache:
          keys:
            - node-deps-v1-{{ checksum "package-lock.json" }}
            - node-deps-v1-
      - run:
          name: Install Dependencies
          command: npm install
      - save_cache:
          paths:
            - node_modules
          key: node-deps-v1-{{ checksum "package-lock.json" }}
      - run:
          name: Run Unit Tests with Coverage
          command: npm test -- --coverage
      - store_artifacts:
          path: coverage
          destination: unit-test-coverage

  deploy-aws:
    docker:
      - image: cimg/aws:2023.05 # Pre-installed with AWS CLI
    steps:
      - checkout
      - run:
          name: Deploy Build Assets to S3
          command: |
            aws s3 sync ./build s3://my-circleci-build-bucket-react --delete

workflows:
  build_and_test:
    jobs:
      - build
      - deploy-aws:
          requires:
            - build
          filters:
            branches:
              only: main
